name: Build APK
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - name: Materialize project
        run: printf %s '' | base64 -d | tar xz
      - name: Build debug APK
        run: |
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest app/build/outputs/apk/debug/app-debug.apk --title ShortsBlocker --notes "Последняя сборка. Скачай app-debug.apk ниже и установи."
