name: Build APK

on:
  workflow_dispatch:namename
    push:

    jobs:
      build:
          runs-on: ubuntu-latest
              steps:
                    - name: Set up JDK 17
                            uses: actions/setup-java@v4
                                    with:
                                              distribution: temurin
                                                        java-version: "17"

                                                              - name: Set up Android SDK
                                                                      uses: android-actions/setup-android@v3

                                                                            - name: Install SDK packages
                                                                                    run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

                                                                                          - name: Materialize project
                                                                                                  run: |
                                                                                                            set -e
                                                                                                                      mkdir -p app/src/main/res/xml
                                                                                                                                mkdir -p app/src/main/java/com/example/shortsblocker/detect
                                                                                                                                          mkdir -p app/src/main/java/com/example/shortsblocker/ban
                                                                                                                                                    printf '%s' 'cGx1Z2luTWFuYWdlbWVudCB7CiAgICByZXBvc2l0b3JpZXMgeyBnb29nbGUoKTsgbWF2ZW5DZW50cmFsKCk7IGdyYWRsZVBsdWdpblBvcnRhbCgpIH0KfQpkZXBlbmRlbmN5UmVzb2x1dGlvbk1hbmFnZW1lbnQgewogICAgcmVwb3NpdG9yaWVzIHsgZ29vZ2xlKCk7IG1hdmVuQ2VudHJhbCgpIH0KfQpyb290UHJvamVjdC5uYW1lID0gIlNob3J0c0Jsb2NrZXIiCmluY2x1ZGUoIjphcHAiKQo=' | base64 -d > 'settings.gradle.kts'
                                                                                                                                                              printf '%s' 'b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bQphbmRyb2lkLnVzZUFuZHJvaWRYPWZhbHNlCmtvdGxpbi5jb2RlLnN0eWxlPW9mZmljaWFsCg==' | base64 -d > 'gradle.properties'
                                                                                                                                                                        printf '%s' '' | base64 -d > 'app/build.gradle.kts'
                                                                                                                                                                                  printf '%s' '' | base64 -d > 'app/src/main/AndroidManifest.xml'
                                                                                                                                                                                            printf '%s' '' | base64 -d > 'app/src/main/res/xml/accessibility_service_config.xml'
                                                                                                                                                                                                      printf '%s' '' | base64 -d > 'app/src/main/java/com/example/shortsblocker/ShortsBlockerService.kt'
                                                                                                                                                                                                                printf '%s' '' | base64 -d > 'app/src/main/java/com/example/shortsblocker/MainActivity.kt'
                                                                                                                                                                                                                          printf '%s' '' | base64 -d > 'app/src/main/java/com/example/shortsblocker/detect/Detection.kt'
                                                                                                                                                                                                                                    printf '%s' '' | base64 -d > 'app/src/main/java/com/example/shortsblocker/ban/Ban.kt'

                                                                                                                                                                                                                                          - name: Build debug APK
                                                                                                                                                                                                                                                  run: |
                                                                                                                                                                                                                                                            set -e
                                                                                                                                                                                                                                                                      gradle wrapper --gradle-version 8.9 --distribution-type bin
                                                                                                                                                                                                                                                                                ./gradlew assembleDebug --no-daemon --stacktrace

                                                                                                                                                                                                                                                                                      - name: Upload APK
                                                                                                                                                                                                                                                                                              uses: actions/upload-artifact@v4
                                                                                                                                                                                                                                                                                                      with:
                                                                                                                                                                                                                                                                                                                name: ShortsBlocker-debug-apk
                                                                                                                                                                                                                                                                                                                          path: app/build/outputs/apk/debug/app-debug.apk
                                                                                                                                                                                                                                                                                                                                    if-no-files-found: error